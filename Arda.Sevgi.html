
<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Arda 🤍 Sevgi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {
    --gold: #e7c77b;
    --cream: #fff7e7;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(130, 75, 90, 0.32),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(65, 85, 125, 0.18),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #111018 0%,
            #09070a 55%,
            #040407 100%
        );

    font-family: "Montserrat", sans-serif;
}

/* =========================
   ARKA PLAN
========================= */

#stars,
#snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#stars {
    z-index: 0;
}

#snow {
    z-index: 20;
}

.aurora {
    position: fixed;
    inset: -20%;
    z-index: 1;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            rgba(255, 190, 205, 0.08),
            transparent 28%
        ),
        radial-gradient(
            ellipse at 75% 55%,
            rgba(235, 185, 100, 0.05),
            transparent 25%
        );

    filter: blur(20px);

    animation:
        auroraMove
        12s
        ease-in-out
        infinite alternate;
}

@keyframes auroraMove {
    from {
        transform: translate3d(0, 0, 0);
    }
    to {
        transform: translate3d(2%, -2%, 0) scale(1.04);
    }
}

.container {
    position: relative;
    z-index: 5;
    width: min(1100px, 92vw);
    margin: auto;
    padding: 20px 0;
    text-align: center;
}

.top-label {
    margin-bottom: 12px;
    color: rgba(255, 247, 231, 0.48);
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.photos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(10px, 2.5vw, 20px);
    max-width: 720px;
    margin: 0 auto;
}

.photo {
    position: relative;
    aspect-ratio: 4 / 4.8;
    overflow: hidden;
    border-radius: 5px;
    background: #151217;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.55);
}

.photo::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    border: 1px solid rgba(255, 238, 200, 0.40);
    box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.025);
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.92) contrast(0.97);
    transform: scale(1.01);
    transition: transform 1.2s cubic-bezier(0.2, 0.7, 0.2, 1), filter 1.2s;
}

.photo:hover img {
    transform: scale(1.055);
    filter: saturate(1.02) contrast(1.02);
}

/* =========================
   SAYAÇ
========================= */

.counter {
    max-width: 800px;
    margin: 20px auto 0;
    padding: 14px 10px 12px;
    border-top: 1px solid rgba(231, 199, 123, 0.28);
    border-bottom: 1px solid rgba(231, 199, 123, 0.18);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.025), transparent);
}

.counter-caption {
    margin-bottom: 8px;
    color: rgba(255, 247, 231, 0.42);
    font-size: 8px;
    letter-spacing: 3px;
}

.timer {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
}

.unit {
    min-width: 0;
    flex: 1;
    padding: 1px 2px;
}

.value {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(24px, 4vw, 42px);
    font-weight: 500;
    line-height: 1;
    color: #f9e8c0;
}

.label {
    display: block;
    margin-top: 3px;
    color: rgba(255, 247, 231, 0.36);
    font-size: 7px;
    letter-spacing: 1.5px;
}

.dot {
    margin-bottom: 8px;
    color: rgba(231, 199, 123, 0.55);
    font-size: 14px;
}

/* =========================
   ROMANTİK SÖZ
========================= */

.quote {
    max-width: 650px;
    margin: 20px auto 0;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(20px, 3.8vw, 34px);
    line-height: 1.1;
    font-weight: 400;
    color: #f7e7bf;
    text-shadow: 0 0 30px rgba(231, 199, 123, 0.14);
}

.heart {
    display: inline-block;
    margin-left: 5px;
    color: #d995a3;
    font-size: 0.55em;
    animation: heartBeat 2.5s ease-in-out infinite;
}

@keyframes heartBeat {
    50% {
        transform: scale(1.15);
        text-shadow: 0 0 18px rgba(233, 168, 182, 0.7);
    }
}

/* ==========================================
   TELEFON MOBİL (TÜM GEREKSİZ BOŞLUKLAR KALDIRILDI)
========================================== */

@media (max-width: 650px) {

    .container {
        width: 92vw;
        padding: 16px 0;
    }

    .top-label {
        margin-bottom: 8px;
        font-size: 9px;
        letter-spacing: 3px;
    }

    .photos {
        width: 100%;
        max-width: 360px;
        gap: 8px;
    }

    .photo {
        aspect-ratio: 4 / 4.6;
        border-radius: 4px;
    }

    .counter {
        width: 100%;
        margin-top: 14px;
        padding: 8px 0 6px;
    }

    .counter-caption {
        margin-bottom: 4px;
        font-size: 6px;
        letter-spacing: 2px;
    }

    .value {
        font-size: 20px;
    }

    .label {
        margin-top: 2px;
        font-size: 5px;
        letter-spacing: 0.5px;
    }

    .dot {
        margin-bottom: 5px;
        font-size: 8px;
    }

    .quote {
        max-width: 310px;
        margin-top: 14px;
        font-size: 18px;
        line-height: 1.15;
    }
}

</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="aurora"></div>
<canvas id="snow"></canvas>

<main class="container">

    <div class="top-label">
        ARDA 🤍 SEVGI
    </div>

    <!-- FOTOĞRAFLAR -->
    <section class="photos">
        <div class="photo">
            <img src="photo1.jpg" alt="Fotoğraf 1">
        </div>

        <div class="photo">
            <img src="photo2.jpg" alt="Fotoğraf 2">
        </div>
    </section>

    <!-- SAYAÇ -->
    <section class="counter">
        <div class="counter-caption">
            10 AĞUSTOS 2026'DAN BERİ
        </div>

        <div class="timer">
            <div class="unit">
                <span class="value" id="years">0</span>
                <span class="label">YIL</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="months">0</span>
                <span class="label">AY</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="days">0</span>
                <span class="label">GÜN</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="hours">00</span>
                <span class="label">SAAT</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="minutes">00</span>
                <span class="label">DAKİKA</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="seconds">00</span>
                <span class="label">SANİYE</span>
            </div>
        </div>
    </section>

    <!-- SÖZ -->
    <div class="quote">
        “Seninle geçirdiğim her saniye akmak yerine iz bırakıyor.”
        <span class="heart">♥</span>
    </div>

</main>

<script>

/* ==========================================
   BAŞLANGIÇ TARİHİ
========================================== */
const start = new Date("2026-08-10T00:00:00+03:00");

/* ==========================================
   TAKVİMSEL ZAMAN HESAPLAMA
========================================== */
function calculateDifference(from, to) {
    let years = to.getUTCFullYear() - from.getUTCFullYear();
    let cursor = new Date(from.getTime());
    cursor.setUTCFullYear(from.getUTCFullYear() + years);

    if (cursor > to) {
        years--;
        cursor = new Date(from.getTime());
        cursor.setUTCFullYear(from.getUTCFullYear() + years);
    }

    let months = to.getUTCMonth() - cursor.getUTCMonth();
    if (months < 0) {
        months += 12;
    }

    let monthCursor = new Date(cursor.getTime());
    monthCursor.setUTCMonth(monthCursor.getUTCMonth() + months);

    if (monthCursor > to) {
        months--;
        monthCursor = new Date(cursor.getTime());
        monthCursor.setUTCMonth(monthCursor.getUTCMonth() + months);
    }

    let remaining = to.getTime() - monthCursor.getTime();

    const DAY = 24 * 60 * 60 * 1000;
    const HOUR = 60 * 60 * 1000;
    const MINUTE = 60 * 1000;
    const SECOND = 1000;

    const days = Math.floor(remaining / DAY);
    remaining %= DAY;

    const hours = Math.floor(remaining / HOUR);
    remaining %= HOUR;

    const minutes = Math.floor(remaining / MINUTE);
    remaining %= MINUTE;

    const seconds = Math.floor(remaining / SECOND);

    return { years, months, days, hours, minutes, seconds };
}

/* ==========================================
   SAYACI GÜNCELLE
========================================== */
function updateTimer() {
    const now = new Date();
    const time = calculateDifference(start, now);

    document.getElementById("years").textContent = time.years;
    document.getElementById("months").textContent = time.months;
    document.getElementById("days").textContent = time.days;
    document.getElementById("hours").textContent = String(time.hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(time.minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(time.seconds).padStart(2, "0");
}

updateTimer();
setInterval(updateTimer, 1000);

/* ==========================================
   YILDIZLAR
========================================== */
const starsCanvas = document.getElementById("stars");
const starsContext = starsCanvas.getContext("2d");
let stars = [];

function resizeStars() {
    const ratio = window.devicePixelRatio || 1;
    starsCanvas.width = window.innerWidth * ratio;
    starsCanvas.height = window.innerHeight * ratio;
    starsCanvas.style.width = window.innerWidth + "px";
    starsCanvas.style.height = window.innerHeight + "px";
    starsContext.setTransform(ratio, 0, 0, ratio, 0, 0);

    stars = Array.from(
        { length: Math.min(170, Math.floor(window.innerWidth / 6)) },
        () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            radius: Math.random() * 1.2 + 0.15,
            opacity: Math.random() * 0.6 + 0.1
        })
    );
}

function drawStars() {
    starsContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
    stars.forEach(star => {
        starsContext.beginPath();
        starsContext.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        starsContext.fillStyle = `rgba(255, 245, 220, ${star.opacity})`;
        starsContext.fill();
    });
    requestAnimationFrame(drawStars);
}

resizeStars();
drawStars();
window.addEventListener("resize", resizeStars);

/* ==========================================
   KAR
========================================== */
const snowCanvas = document.getElementById("snow");
const snowContext = snowCanvas.getContext("2d");
let snowflakes = [];

function resizeSnow() {
    const ratio = window.devicePixelRatio || 1;
    snowCanvas.width = window.innerWidth * ratio;
    snowCanvas.height = window.innerHeight * ratio;
    snowCanvas.style.width = window.innerWidth + "px";
    snowCanvas.style.height = window.innerHeight + "px";
    snowContext.setTransform(ratio, 0, 0, ratio, 0, 0);

    snowflakes = Array.from(
        { length: Math.min(150, Math.floor(window.innerWidth / 7)) },
        () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            radius: Math.random() * 2.3 + 0.5,
            speed: Math.random() * 1.1 + 0.35,
            wind: Math.random() * 0.55 - 0.275,
            opacity: Math.random() * 0.65 + 0.2
        })
    );
}

function drawSnow() {
    snowContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
    snowflakes.forEach(flake => {
        snowContext.beginPath();
        snowContext.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        snowContext.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
        snowContext.shadowBlur = 6;
        snowContext.shadowColor = "#ffffff";
        snowContext.fill();

        flake.y += flake.speed;
        flake.x += flake.wind + Math.sin(flake.y / 70) * 0.15;

        if (flake.y > window.innerHeight + 8) {
            flake.y = -8;
            flake.x = Math.random() * window.innerWidth;
        }
    });
    requestAnimationFrame(drawSnow);
}

resizeSnow();
drawSnow();
window.addEventListener("resize", resizeSnow);

</script>

</body>
</html>
