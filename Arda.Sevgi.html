
<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Arda 🤍 Sevgi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {
    --gold: #e7c77b;
    --cream: #fff7e7;
    --pink: #e9a8b6;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(130, 75, 90, 0.32),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(65, 85, 125, 0.18),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #111018 0%,
            #09070a 55%,
            #040407 100%
        );

    font-family: "Montserrat", sans-serif;
}

/* =========================
   ARKA PLAN
========================= */

#stars,
#snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#stars {
    z-index: 0;
}

#snow {
    z-index: 20;
}

.aurora {
    position: fixed;
    inset: -20%;
    z-index: 1;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            rgba(255, 190, 205, 0.08),
            transparent 28%
        ),
        radial-gradient(
            ellipse at 75% 55%,
            rgba(235, 185, 100, 0.05),
            transparent 25%
        );

    filter: blur(20px);

    animation:
        auroraMove
        12s
        ease-in-out
        infinite alternate;
}

@keyframes auroraMove {
    from {
        transform: translate3d(0, 0, 0);
    }
    to {
        transform: translate3d(2%, -2%, 0) scale(1.04);
    }
}

.container {
    position: relative;
    z-index: 5;
    width: min(1100px, 92vw);
    margin: auto;
    padding: 35px 0 35px; /* Üst-alt iç boşluk sıkılaştırıldı */
    text-align: center;
}

.kicker {
    margin-bottom: 8px; /* Düşürüldü */
    color: rgba(255, 247, 231, 0.48);
    font-size: 10px;
    letter-spacing: 7px;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(48px, 8vw, 90px);
    font-weight: 400;
    line-height: 0.85;
    letter-spacing: -2px;
    color: #fff8ea;
    text-shadow: 0 4px 35px rgba(255, 210, 140, 0.13);
}

.intro {
    max-width: 560px;
    margin: 12px auto 24px; /* Düşürüldü */
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(18px, 2.5vw, 24px);
    line-height: 1.3;
    color: rgba(255, 247, 231, 0.70);
}

.photos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(12px, 3vw, 28px);
    max-width: 800px;
    margin: auto;
}

.photo {
    position: relative;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    border-radius: 5px;
    background: #151217;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
}

.photo::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    border: 1px solid rgba(255, 238, 200, 0.40);
    box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.025);
}

.photo::after {
    content: "";
    position: absolute;
    z-index: 3;
    width: 130px;
    height: 130px;
    right: -55px;
    bottom: -65px;
    border-radius: 50%;
    background: rgba(255, 218, 150, 0.16);
    filter: blur(30px);
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.92) contrast(0.97);
    transform: scale(1.01);
    transition: transform 1.2s cubic-bezier(0.2, 0.7, 0.2, 1), filter 1.2s;
}

.photo:hover img {
    transform: scale(1.055);
    filter: saturate(1.02) contrast(1.02);
}

.photo-label {
    position: absolute;
    z-index: 4;
    left: 16px;
    bottom: 14px;
    font-family: "Cormorant Garamond", serif;
    font-size: 16px;
    color: rgba(255, 247, 231, 0.75);
    text-shadow: 0 2px 10px #000;
}

/* =========================
   AYIRICI
========================= */

.divider {
    width: 80px;
    height: 1px;
    margin: 24px auto 20px; /* Düşürüldü */
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow: 0 0 12px rgba(231, 199, 123, 0.35);
}

/* =========================
   SAYAÇ
========================= */

.counter {
    max-width: 860px;
    margin: auto;
    padding: 18px 15px 14px; /* Düşürüldü */
    border-top: 1px solid rgba(231, 199, 123, 0.28);
    border-bottom: 1px solid rgba(231, 199, 123, 0.18);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.025), transparent);
}

.counter-caption {
    margin-bottom: 12px; /* Düşürüldü */
    color: rgba(255, 247, 231, 0.42);
    font-size: 9px;
    letter-spacing: 4px;
}

.timer {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
}

.unit {
    min-width: 85px;
    padding: 2px 6px;
}

.value {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(32px, 4.5vw, 48px);
    font-weight: 500;
    line-height: 1;
    color: #f9e8c0;
}

.label {
    display: block;
    margin-top: 4px;
    color: rgba(255, 247, 231, 0.36);
    font-size: 8px;
    letter-spacing: 2.5px;
}

.dot {
    margin-bottom: 10px;
    color: rgba(231, 199, 123, 0.55);
    font-size: 16px;
}

/* =========================
   ROMANTİK SÖZ
========================= */

.quote {
    max-width: 700px;
    margin: 24px auto 0; /* Düşürüldü */
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(24px, 4.2vw, 40px);
    line-height: 1.1;
    font-weight: 400;
    color: #f7e7bf;
    text-shadow: 0 0 35px rgba(231, 199, 123, 0.14);
}

.quote em {
    color: #e9b5bf;
    font-style: normal;
}

.heart {
    display: inline-block;
    margin-left: 6px;
    color: #d995a3;
    font-size: 0.55em;
    animation: heartBeat 2.5s ease-in-out infinite;
}

@keyframes heartBeat {
    50% {
        transform: scale(1.15);
        text-shadow: 0 0 18px rgba(233, 168, 182, 0.7);
    }
}

.small-date {
    margin-top: 12px; /* Düşürüldü */
    color: rgba(255, 247, 231, 0.27);
    font-size: 9px;
    letter-spacing: 3px;
}

/* ==========================================
   TELEFON MOBİL
========================================== */

@media (max-width: 650px) {

    html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
    }

    body {
        min-height: 100dvh;
        height: 100dvh;
    }

    .container {
        width: 94vw;
        height: 100dvh;
        min-height: 100dvh;
        padding: 12px 0 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .kicker {
        margin-bottom: 4px;
        font-size: 7px;
        letter-spacing: 3px;
    }

    h1 {
        font-size: clamp(36px, 11vw, 52px);
        line-height: 0.85;
        letter-spacing: -1px;
    }

    .intro {
        max-width: 320px;
        margin: 6px auto 10px;
        font-size: 15px;
        line-height: 1.1;
    }

    .photos {
        width: 100%;
        max-width: 380px;
        gap: 6px;
        margin: 0 auto;
    }

    .photo {
        aspect-ratio: 4 / 4.5;
        border-radius: 4px;
    }

    .photo::before {
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.025);
    }

    .photo-label {
        left: 8px;
        bottom: 6px;
        font-size: 12px;
    }

    .divider {
        width: 45px;
        margin: 8px auto 6px;
    }

    .counter {
        width: 100%;
        padding: 6px 0 5px;
    }

    .counter-caption {
        margin-bottom: 4px;
        font-size: 6px;
        letter-spacing: 2px;
    }

    .timer {
        width: 100%;
        flex-wrap: nowrap;
    }

    .unit {
        min-width: 0;
        flex: 1;
        padding: 1px 0;
    }

    .value {
        font-size: clamp(18px, 5.5vw, 24px);
    }

    .label {
        margin-top: 2px;
        font-size: 5px;
        letter-spacing: 0.5px;
    }

    .dot {
        margin-bottom: 6px;
        font-size: 8px;
    }

    .quote {
        max-width: 330px;
        margin: 8px auto 0;
        font-size: clamp(18px, 5.2vw, 24px);
        line-height: 1.02;
    }

    .heart {
        margin-left: 3px;
    }

    .small-date {
        margin-top: 5px;
        font-size: 5.5px;
        letter-spacing: 1.5px;
    }
}

@media (max-width: 650px) and (max-height: 700px) {
    .container { padding: 6px 0 4px; }
    .kicker { margin-bottom: 2px; }
    h1 { font-size: 34px; }
    .intro { margin: 4px auto 6px; font-size: 13px; }
    .photos { gap: 4px; }
    .photo { aspect-ratio: 4 / 4; }
    .divider { margin: 6px auto 4px; }
    .counter { padding: 4px 0 3px; }
    .counter-caption { margin-bottom: 3px; }
    .value { font-size: 16px; }
    .label { font-size: 4px; }
    .quote { margin-top: 6px; font-size: 17px; }
    .small-date { margin-top: 3px; font-size: 5px; }
}

@media (max-width: 900px) and (orientation: landscape) {
    html, body { overflow: hidden; height: 100%; }
    body { min-height: 100dvh; }
    .container { height: 100dvh; min-height: 100dvh; padding: 6px 0; justify-content: center; }
    .kicker { margin-bottom: 2px; font-size: 6px; }
    h1 { font-size: 36px; }
    .intro { margin: 3px auto 5px; font-size: 13px; }
    .photos { max-width: 380px; gap: 6px; }
    .photo { aspect-ratio: 4 / 2.8; }
    .divider { margin: 5px auto 4px; }
    .counter { padding: 4px 0; }
    .counter-caption { margin-bottom: 3px; }
    .value { font-size: 18px; }
    .quote { margin-top: 5px; font-size: 18px; }
    .small-date { margin-top: 3px; }
}

</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="aurora"></div>
<canvas id="snow"></canvas>

<main class="container">

    <div class="kicker">
        Arda 🤍 Sevgi
    </div>

    <h1>
        
    </h1>

    <p class="intro">
        
    </p>

    <!-- FOTOĞRAFLAR -->
    <section class="photos">
        <div class="photo">
            <img src="photo1.jpg" alt="Birlikte bir anımız">
            <div class="photo-label"></div>
        </div>

        <div class="photo">
            <img src="photo2.jpg" alt="Birlikte bir anımız">
            <div class="photo-label"></div>
        </div>
    </section>

    <div class="divider"></div>

    <!-- SAYAÇ -->
    <section class="counter">
        <div class="counter-caption">
            10 AĞUSTOS 2026'DAN BERİ
        </div>

        <div class="timer">
            <div class="unit">
                <span class="value" id="years">0</span>
                <span class="label">YIL</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="months">0</span>
                <span class="label">AY</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="days">0</span>
                <span class="label">GÜN</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="hours">00</span>
                <span class="label">SAAT</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="minutes">00</span>
                <span class="label">DAKİKA</span>
            </div>

            <span class="dot">·</span>

            <div class="unit">
                <span class="value" id="seconds">00</span>
                <span class="label">SANİYE</span>
            </div>
        </div>
    </section>

    <!-- SÖZ -->
    <div class="quote">
        “Seninle geçirdiğim her saniye <em>akmak yerine iz bırakıyor.</em>”
        <span class="heart">♥</span>
    </div>

    <div class="small-date">
        Arda 🤍 Sevgi
    </div>

</main>

<script>

/* ==========================================
   BAŞLANGIÇ TARİHİ
========================================== */
const start = new Date("2026-08-10T00:00:00+03:00");

/* ==========================================
   TAKVİMSEL ZAMAN HESAPLAMA
========================================== */
function calculateDifference(from, to) {
    let years = to.getUTCFullYear() - from.getUTCFullYear();
    let cursor = new Date(from.getTime());
    cursor.setUTCFullYear(from.getUTCFullYear() + years);

    if (cursor > to) {
        years--;
        cursor = new Date(from.getTime());
        cursor.setUTCFullYear(from.getUTCFullYear() + years);
    }

    let months = to.getUTCMonth() - cursor.getUTCMonth();
    if (months < 0) {
        months += 12;
    }

    let monthCursor = new Date(cursor.getTime());
    monthCursor.setUTCMonth(monthCursor.getUTCMonth() + months);

    if (monthCursor > to) {
        months--;
        monthCursor = new Date(cursor.getTime());
        monthCursor.setUTCMonth(monthCursor.getUTCMonth() + months);
    }

    let remaining = to.getTime() - monthCursor.getTime();

    const DAY = 24 * 60 * 60 * 1000;
    const HOUR = 60 * 60 * 1000;
    const MINUTE = 60 * 1000;
    const SECOND = 1000;

    const days = Math.floor(remaining / DAY);
    remaining %= DAY;

    const hours = Math.floor(remaining / HOUR);
    remaining %= HOUR;

    const minutes = Math.floor(remaining / MINUTE);
    remaining %= MINUTE;

    const seconds = Math.floor(remaining / SECOND);

    return { years, months, days, hours, minutes, seconds };
}

/* ==========================================
   SAYACI GÜNCELLE
========================================== */
function updateTimer() {
    const now = new Date();
    const time = calculateDifference(start, now);

    document.getElementById("years").textContent = time.years;
    document.getElementById("months").textContent = time.months;
    document.getElementById("days").textContent = time.days;
    document.getElementById("hours").textContent = String(time.hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(time.minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(time.seconds).padStart(2, "0");
}

updateTimer();
setInterval(updateTimer, 1000);

/* ==========================================
   YILDIZLAR
========================================== */
const starsCanvas = document.getElementById("stars");
const starsContext = starsCanvas.getContext("2d");
let stars = [];

function resizeStars() {
    const ratio = window.devicePixelRatio || 1;
    starsCanvas.width = window.innerWidth * ratio;
    starsCanvas.height = window.innerHeight * ratio;
    starsCanvas.style.width = window.innerWidth + "px";
    starsCanvas.style.height = window.innerHeight + "px";
    starsContext.setTransform(ratio, 0, 0, ratio, 0, 0);

    stars = Array.from(
        { length: Math.min(170, Math.floor(window.innerWidth / 6)) },
        () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            radius: Math.random() * 1.2 + 0.15,
            opacity: Math.random() * 0.6 + 0.1
        })
    );
}

function drawStars() {
    starsContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
    stars.forEach(star => {
        starsContext.beginPath();
        starsContext.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        starsContext.fillStyle = `rgba(255, 245, 220, ${star.opacity})`;
        starsContext.fill();
    });
    requestAnimationFrame(drawStars);
}

resizeStars();
drawStars();
window.addEventListener("resize", resizeStars);

/* ==========================================
   KAR
========================================== */
const snowCanvas = document.getElementById("snow");
const snowContext = snowCanvas.getContext("2d");
let snowflakes = [];

function resizeSnow() {
    const ratio = window.devicePixelRatio || 1;
    snowCanvas.width = window.innerWidth * ratio;
    snowCanvas.height = window.innerHeight * ratio;
    snowCanvas.style.width = window.innerWidth + "px";
    snowCanvas.style.height = window.innerHeight + "px";
    snowContext.setTransform(ratio, 0, 0, ratio, 0, 0);

    snowflakes = Array.from(
        { length: Math.min(150, Math.floor(window.innerWidth / 7)) },
        () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            radius: Math.random() * 2.3 + 0.5,
            speed: Math.random() * 1.1 + 0.35,
            wind: Math.random() * 0.55 - 0.275,
            opacity: Math.random() * 0.65 + 0.2
        })
    );
}

function drawSnow() {
    snowContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
    snowflakes.forEach(flake => {
        snowContext.beginPath();
        snowContext.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        snowContext.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
        snowContext.shadowBlur = 6;
        snowContext.shadowColor = "#ffffff";
        snowContext.fill();

        flake.y += flake.speed;
        flake.x += flake.wind + Math.sin(flake.y / 70) * 0.15;

        if (flake.y > window.innerHeight + 8) {
            flake.y = -8;
            flake.x = Math.random() * window.innerWidth;
        }
    });
    requestAnimationFrame(drawSnow);
}

resizeSnow();
drawSnow();
window.addEventListener("resize", resizeSnow);

</script>

</body>
</html>
