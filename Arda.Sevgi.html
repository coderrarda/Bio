<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Arda🤍Sevgi</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');

:root {

    --cream: #fff7e7;
    --pink: #e9a8b6;
}

* {

    margin: 0;

}

html,

}

body {

}

/* =========================
   ARKA PLAN
========================= */

#stars,
#snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#stars {
    z-index: 0;
}

#snow {
    z-index: 20;
}

.aurora {
    position: fixed;
    inset: -20%;
    z-index: 1;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            rgba(255, 190, 205, 0.08),
            transparent 28%
        ),
        radial-gradient(
            ellipse at 75% 55%,
            rgba(235, 185, 100, 0.05),
            transparent 25%
        );

    filter: blur(20px);

    animation:
        auroraMove
        12s
        ease-in-out
        infinite alternate;
}

@keyframes auroraMove {

    from {
        transform:
            translate3d(0, 0, 0);
    }

    to {
        transform:
            translate3d(2%, -2%, 0)
            scale(1.04);
    }
}



.container {
    position: relative;
    z-index: 5;

    width: min(1100px, 92vw);

    margin: auto;

    padding:
        75px
        0
        70px;

    text-align: center;
}



.kicker {
    margin-bottom: 20px;

    color:
        rgba(
            255,
            247,
            231,
            0.48
        );

    font-size: 10px;
    letter-spacing: 7px;
    text-transform: uppercase;
}

h1 {
    margin: 0;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(
            58px,
            10vw,
            116px
        );

    font-weight: 400;
    line-height: 0.78;

    letter-spacing: -3px;

    color: #fff8ea;

    text-shadow:
        0 4px 35px
        rgba(
            255,
            210,
            140,
            0.13
        );
}

.intro {
    max-width: 560px;

    margin:
        30px
        auto
        48px;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        clamp(
            20px,
            3vw,
            27px
        );

    line-height: 1.35;

    color:
        rgba(
            255,
            247,
            231,
            0.70

}


.photos {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        clamp(
            16px,
            4vw,
            44px
        );

    max-width: 960px;

    margin: auto;
}

.photo {
    position: relative;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    border-radius: 5px;

    background:
        #151217;

    box-shadow:
        0 25px 80px
        rgba(
            0,
            0,
            0,
            0.55
        );
}

.photo::before {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 2;

    pointer-events: none;

    border:
        1px solid
        rgba(
            255,
            238,
            200,
            0.40
        );

    box-shadow:
        inset 0 0 0 7px
        rgba(
            255,
            255,
            255,
            0.025
        );
}

.photo::after {
    content: "";

    position: absolute;

    z-index: 3;

    width: 130px;
    height: 130px;

    right: -55px;
    bottom: -65px;

    border-radius: 50%;

    background:
        rgba(
            255,
            218,
            150,
            0.16
        );

    filter: blur(30px);
}

.photo img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    filter:
        saturate(0.92)
        contrast(0.97);

    transform:
        scale(1.01);

    transition:
        transform 1.2s
        cubic-bezier(
            0.2,
            0.7,
            0.2,
            1
        ),
        filter 1.2s;
}

.photo:hover img {
    transform:

    filter:

}

.photo-label {

<script>

/* ==========================================
   BAŞLANGIÇ TARİHİ
   10 Ağustos 2026
   00:00 Türkiye saati
========================================== */

const start =
    new Date(
        "2026-08-10T00:00:00+03:00"
    );


/* ==========================================
   TAKVİMSEL ZAMAN HESAPLAMA
========================================== */

function calculateDifference(
    from,
    to
) {

    let years =
        to.getUTCFullYear()
        -
        from.getUTCFullYear();


    let cursor =
        new Date(
            from.getTime()
        );


    cursor.setUTCFullYear(
        from.getUTCFullYear()
        +
        years
    );


    if (cursor > to) {

        years--;

        cursor =
            new Date(
                from.getTime()
            );

        cursor.setUTCFullYear(
            from.getUTCFullYear()
            +
            years
        );
    }


    let months =
        to.getUTCMonth()
        -
        cursor.getUTCMonth();


    if (months < 0) {
        months += 12;
    }


    let monthCursor =
        new Date(
            cursor.getTime()
        );


    monthCursor.setUTCMonth(
        monthCursor.getUTCMonth()
        +
        months
    );


    if (monthCursor > to) {

        months--;

        monthCursor =
            new Date(
                cursor.getTime()
            );

        monthCursor.setUTCMonth(
            monthCursor.getUTCMonth()
            +
            months
        );
    }


    let remaining =
        to.getTime()
        -
        monthCursor.getTime();


    const DAY =
        24 * 60 * 60 * 1000;

    const HOUR =
        60 * 60 * 1000;

    const MINUTE =
        60 * 1000;

    const SECOND =
        1000;


    const days =
        Math.floor(
            remaining / DAY
        );

    remaining %= DAY;


    const hours =
        Math.floor(
            remaining / HOUR
        );

    remaining %= HOUR;


    const minutes =
        Math.floor(
            remaining / MINUTE
        );

    remaining %= MINUTE;


    const seconds =
        Math.floor(
            remaining / SECOND
        );


    return {
        years,
        months,
        days,
        hours,
        minutes,
        seconds
    };
}


/* ==========================================
   SAYACI GÜNCELLE
========================================== */

function updateTimer() {

    const now =
        new Date();


    const time =
        calculateDifference(
            start,
            now
        );


    document.getElementById(
        "years"
    ).textContent =
        time.years;


    document.getElementById(
        "months"
    ).textContent =
        time.months;


    document.getElementById(
        "days"
    ).textContent =
        time.days;


    document.getElementById(
        "hours"
    ).textContent =
        String(
            time.hours
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "minutes"
    ).textContent =
        String(
            time.minutes
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "seconds"
    ).textContent =
        String(
            time.seconds
        ).padStart(
            2,
            "0"
        );
}


updateTimer();


setInterval(
    updateTimer,
    1000
);


/* ==========================================
   YILDIZLAR
========================================== */

const starsCanvas =
    document.getElementById(
        "stars"
    );


const starsContext =
    starsCanvas.getContext(
        "2d"
    );


let stars = [];


function resizeStars() {

    const ratio =
        window.devicePixelRatio || 1;


    starsCanvas.width =
        window.innerWidth *
        ratio;


    starsCanvas.height =
        window.innerHeight *
        ratio;


    starsCanvas.style.width =
        window.innerWidth +
        "px";


    starsCanvas.style.height =
        window.innerHeight +
        "px";


    starsContext.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    stars =
        Array.from(
            {
                length:
                    Math.min(
                        170,
                        Math.floor(
                            window.innerWidth / 6
                        )
                    )
            },

            () => ({

                x:
                    Math.random()
                    *
                    window.innerWidth,

                y:
                    Math.random()
                    *
                    window.innerHeight,

                radius:
                    Math.random()
                    *
                    1.2
                    +
                    0.15,

                opacity:
                    Math.random()
                    *
                    0.6
                    +
                    0.1

            })
        );
}


function drawStars() {

    starsContext.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    stars.forEach(
        star => {

            starsContext.beginPath();


            starsContext.arc(
                star.x,
                star.y,
                star.radius,
                0,
                Math.PI * 2
            );


            starsContext.fillStyle =
                `rgba(
                    255,
                    245,
                    220,
                    ${star.opacity}
                )`;


            starsContext.fill();

        }
    );


    requestAnimationFrame(
        drawStars
    );
}


resizeStars();

drawStars();


window.addEventListener(
    "resize",
    resizeStars
);


/* ==========================================
   KAR
========================================== */

const snowCanvas =
    document.getElementById(
        "snow"
    );


const snowContext =
    snowCanvas.getContext(
        "2d"
    );


let snowflakes = [];


function resizeSnow() {

    const ratio =
        window.devicePixelRatio || 1;


    snowCanvas.width =
        window.innerWidth *
        ratio;


    snowCanvas.height =
        window.innerHeight *
        ratio;


    snowCanvas.style.width =
        window.innerWidth +
        "px";


    snowCanvas.style.height =
        window.innerHeight +
        "px";


    snowContext.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    snowflakes =
        Array.from(
            {
                length:
                    Math.min(
                        150,
                        Math.floor(
                            window.innerWidth / 7
                        )
                    )
            },

            () => ({

                x:
                    Math.random()
                    *
                    window.innerWidth,

                y:
                    Math.random()
                    *
                    window.innerHeight,

                radius:
                    Math.random()
                    *
                    2.3
                    +
                    0.5,

                speed:
                    Math.random()
                    *
                    1.1
                    +
                    0.35,

                wind:
                    Math.random()
                    *
                    0.55
                    -
                    0.275,

                opacity:
                    Math.random()
                    *
                    0.65
                    +
                    0.2

            })
        );
}


function drawSnow() {

    snowContext.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    snowflakes.forEach(
        flake => {

            snowContext.beginPath();


            snowContext.arc(
                flake.x,
                flake.y,
                flake.radius,
                0,
                Math.PI * 2
            );


            snowContext.fillStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${flake.opacity}
                )`;


            snowContext.shadowBlur = 6;


            snowContext.shadowColor =
                "#ffffff";


            snowContext.fill();


            flake.y +=
                flake.speed;


            flake.x +=
                flake.wind
                +
                Math.sin(
                    flake.y / 70
                ) * 0.15;


            if (
                flake.y
                >
                window.innerHeight + 8
            ) {

                flake.y = -8;

                flake.x =
                    Math.random()
                    *
                    window.innerWidth;
            }

        }
    );


    requestAnimationFrame(
        drawSnow
    );
}


resizeSnow();

drawSnow();


window.addEventListener(
    "resize",
    resizeSnow
);

</script>

</body>
</html>
